<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"><style>
.f1{animation:fa 17s ease-in-out infinite alternate}.f2{animation:fb 21s ease-in-out infinite alternate}.f3{animation:fa 25s ease-in-out infinite alternate-reverse}
