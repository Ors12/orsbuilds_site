@keyframes fb{from{transform:translate(-8px,-16px) rotate(1deg)}to{transform:translate(8px,20px) rotate(-1deg)}}
.scroll{animation:sc 22s linear infinite}@keyframes sc{to{transform:translateY(-640px)}}
.stand{animation:fb 30s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
